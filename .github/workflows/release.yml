# Builds an Arch Linux binary and a macOS app whenever a version tag (v0.0.1, v1.2.3, ...) is pushed.
# The tag becomes the app version: Cargo.toml is rewritten before the build, so
# `CARGO_PKG_VERSION` (shown in the sidebar) matches the tag.
name: Release build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: read

jobs:
  build-arch:
    # Pinned: the job runs in a container, so the host image only needs to be stable.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup pkgconf \
            fontconfig freetype2 libxkbcommon wayland libglvnd \
            libx11 libxcursor libxi libxrandr

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/checkout@v7

      - name: Set version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Only the [package] version line (the first `version =` in the file).
          sed -i "0,/^version = \".*\"/s//version = \"$version\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # Not --locked: the version bump rewrites aggrega's own entry in Cargo.lock.
        # Dependencies stay pinned by the committed lock file.
        run: cargo build --release

      - name: Package
        id: package
        run: |
          name="aggrega-${{ steps.version.outputs.version }}-x86_64"
          mkdir -p "dist/$name"
          install -m755 target/release/aggrega "dist/$name/aggrega"
          install -m644 packaging/aggrega.desktop assets/aggrega.svg README.md LICENSE "dist/$name/"
          # A tarball keeps the executable bit.
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          # Upload the tarball as-is (no zip wrapper); the artifact takes the file's name.
          archive: false
          path: dist/${{ steps.package.outputs.name }}.tar.gz
          if-no-files-found: error

  build-macos:
    # Universal (Apple silicon + Intel) Aggrega.app, zipped. Unsigned apart from an
    # ad-hoc signature, so Gatekeeper asks on first launch (see docs/BUILDING.md).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
          # rsvg-convert renders the .icns sizes from assets/aggrega.svg.
          brew install librsvg

      - name: Set version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # BSD sed: only the [package] version line (the first `version =`).
          sed -i '' "1,/^version = /s/^version = \".*\"/version = \"$version\"/" Cargo.toml
          grep -m1 '^version' Cargo.toml

      - uses: Swatinem/rust-cache@v2

      - name: Build and bundle
        # Not --locked, for the same reason as the Linux build.
        run: packaging/macos/bundle.sh "${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: dist/aggrega-${{ steps.version.outputs.version }}-macos-universal.zip
          if-no-files-found: error
