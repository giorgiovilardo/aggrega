# Runs the lints and the test suite on pushes to main and on every pull request
# (including ones from forks). Tags are left to release.yml.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new stable release doesn't change rust-cache's key and force a
  # cold build (~7 min instead of ~1.5). Bump deliberately.
  RUST_TOOLCHAIN: "1.99.0"
  # Line tables keep test backtraces useful but shrink target/ (and the cache
  # that has to be uploaded and restored) considerably.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  test:
    # Pinned: the job runs in a container, so the host image only needs to be stable.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup pkgconf \
            fontconfig freetype2 libxkbcommon wayland libglvnd \
            libx11 libxcursor libxi libxrandr \
            ttf-dejavu

      - name: Install Rust toolchain
        run: rustup toolchain install $RUST_TOOLCHAIN --profile minimal && rustup default $RUST_TOOLCHAIN

      - uses: actions/checkout@v7

      # Only main saves: PRs restore main's cache, and per-PR copies (~1.3 GB
      # each) would otherwise push main's out of the 10 GB repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # UI tests use Slint's headless testing backend, so no display is needed,
      # but font lookup needs at least one system font (hence ttf-dejavu).
      - name: Test
        run: cargo test --locked

  # The same checks as `make lint`. Clippy compiles the crate, so it needs the
  # same native libraries as the test job.
  lint:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup pkgconf \
            fontconfig freetype2 libxkbcommon wayland libglvnd \
            libx11 libxcursor libxi libxrandr

      - name: Install Rust toolchain
        run: |
          rustup toolchain install $RUST_TOOLCHAIN --profile minimal --component clippy,rustfmt
          rustup default $RUST_TOOLCHAIN

      - uses: actions/checkout@v7

      # Only main saves: PRs restore main's cache, and per-PR copies (~1.3 GB
      # each) would otherwise push main's out of the 10 GB repo limit.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings
