# Runs the lints and the test suite on pushes to main and on every pull request
# (including ones from forks). Tags are left to release.yml.
# Pushes that only touch the landing page (public/) skip it; pages.yml deploys those.
# PRs always run it, since `test` is a required check on main.
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "public/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned: the job runs in a container, so the host image only needs to be stable.
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup pkgconf \
            fontconfig freetype2 libxkbcommon wayland libglvnd \
            libx11 libxcursor libxi libxrandr \
            ttf-dejavu

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      # UI tests use Slint's headless testing backend, so no display is needed,
      # but font lookup needs at least one system font (hence ttf-dejavu).
      - name: Test
        run: cargo test --locked

  # The same checks as `make lint`. Clippy compiles the crate and its tests, so
  # it needs the same native libraries as the test job.
  lint:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git rustup pkgconf \
            fontconfig freetype2 libxkbcommon wayland libglvnd \
            libx11 libxcursor libxi libxrandr

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
